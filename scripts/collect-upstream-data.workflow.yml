# Template for .github/workflows/collect-upstream-data.yml
#
# This sandbox agent's GitHub App token is not allowed to create files
# under .github/workflows/, so the workflow ships here instead. To enable
# scheduled/one-click CI collection on a runner with direct MLB egress:
#   cp scripts/collect-upstream-data.workflow.yml .github/workflows/
#   git commit -am 'ci: enable official-data collection workflow' && git push
# (then run it from the Actions tab, or push a change to a collector).)

name: Collect official MLB data

# Runs the official-endpoint collectors on a GitHub runner (which has
# normal egress to statsapi.mlb.com / baseballsavant.mlb.com) and uploads
# the verbatim raw captures as an artifact. Everything is the same code
# path as `python -m mlb_predict collect ...` on a laptop.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Comma-separated seasons to collect probables for"
        required: false
        default: "2024,2025"
      hist_seasons:
        description: "Comma-separated seasons to collect schedule/results for"
        required: false
        default: "2016,2017,2018,2019,2021,2022,2023"
  push:
    branches:
      - arena/01a010f8-mlb-prediction-model-backtest
    paths:
      - ".github/workflows/collect-upstream-data.yml"
      - "mlb_predict/collect_probables.py"
      - "mlb_predict/collect_statcast.py"

concurrency:
  group: collect-upstream-data
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect historical schedule/results windows (official scores)
        env:
          HIST_SEASONS: ${{ github.event.inputs.hist_seasons || '2015,2016,2017,2018,2019,2020,2021,2022' }}
        run: |
          for y in $(echo "$HIST_SEASONS" | tr ',' ' '); do
            python -m mlb_predict collect \
              --start "${y}-03-01" --end "${y}-11-15" --window-days 10
          done

      - name: Collect probable starting pitchers (schedule + hydrate)
        env:
          SEASONS: ${{ github.event.inputs.seasons || '2024,2025' }}
        run: |
          for y in $(echo "$SEASONS" | tr ',' ' '); do
            python -m mlb_predict collect-probables \
              --start "${y}-03-01" --end "${y}-10-10" --window-days 5
          done

      - name: Collect Statcast pitching-quality boards (prior seasons)
        run: |
          for y in 2023 2024 2025; do
            python -m mlb_predict collect-statcast \
              --board pitching_quality --year "$y" --min-pa 100
          done

      - name: Summarize captures
        run: |
          echo "probables windows: $(ls data/raw/probables | wc -l)"
          echo "statcast boards:   $(ls data/raw/statcast | wc -l)"
          cat data/raw/probables_manifest.csv | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: official-mlb-captures
          if-no-files-found: error
          path: |
            data/raw/schedule/
            data/raw/probables/
            data/raw/statcast/
            data/raw/probables_manifest.csv
